name: "Update Changelog"

on:
  release:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.event.release.name }}
          release-notes: ${{ github.event.release.body }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: changelog/${{ github.event.release.name }}
          title: "Update CHANGELOG for ${{ github.event.release.name }}"
          commit-message: "Update CHANGELOG for ${{ github.event.release.name }}"
          body: "Automated changelog update for release ${{ github.event.release.name }}"
