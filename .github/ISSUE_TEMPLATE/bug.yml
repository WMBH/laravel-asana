name: Bug Report
description: Report a bug
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package Version
      description: What version of our package are you running?
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP Version
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel Version
    validations:
      required: true
